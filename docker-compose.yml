services:
  postgres:
    image: postgres:16
    container_name: nanoresearch-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nanoresearch
    volumes:
      - ./docker/volumes/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nanoresearch"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nanoresearch-gateway:
    container_name: nanoresearch-gateway
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/nanoresearch
    volumes:
      - ~/.nanoresearch:/root/.nanoresearch
    # Multi-tenant / custom-base example:
    #   environment:
    #     NANORESEARCH_HOME: /data/tenant_x
    #   volumes:
    #     - ./tenant_x:/data/tenant_x
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - "18790:18790"
      - "8765:8765"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  nanoresearch-cli:
    container_name: nanoresearch-cli
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    profiles:
      - cli
    volumes:
      - ~/.nanoresearch:/root/.nanoresearch
    command: ["status"]
    stdin_open: true
    tty: true

volumes: {}
